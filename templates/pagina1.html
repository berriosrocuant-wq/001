<!DOCTYPE html>
<html>
<head>
    <title>Formulario de Notas</title>

    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial;
        }

        .contenedor {
            background-color: white;
            width: 400px;
            margin: 20px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 3px 8px gray;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Formulario de Notas</h1>

        <form method="POST">

            <label>Nota 1:</label>
            <input type="number" name="nota1" min="1" max="7" step="0.1" required>

            <label>Nota 2:</label>
            <input type="number" name="nota2" min="1" max="7" step="0.1" required>

            <label>Nota 3:</label>
            <input type="number" name="nota3" min="1" max="7" step="0.1" required>

            <label>Asistencia (%):</label>
            <input type="number" name="asistencia" min="0" max="100" required>

            <button type="submit">Enviar</button>

        </form>

        {% if promedio is defined %}

            <h3>{{ promedio }}</h3>

            <h3>{{ resultado }}</h3>

        {% endif %}

    </div>

</body>
</html>
