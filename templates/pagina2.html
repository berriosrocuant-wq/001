<!DOCTYPE html>
<html>
<head>

    <title>Ejercicio 2</title>

    <style>

        body {
            background-color: #f0f0f0;
            font-family: Arial;
            text-align: center;
        }

        .contenedor {
            background-color: white;
            width: 300px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 3px 8px gray;
        }

        label {
            display: block;
            font-size: 20px;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <form method="POST">

            <label>Nombre 1:</label>
            <input type="text" name="nombre1" required>

            <label>Nombre 2:</label>
            <input type="text" name="nombre2" required>

            <label>Nombre 3:</label>
            <input type="text" name="nombre3" required>

            <button type="submit">Enviar</button>

        </form>

        {% if resultado is defined %}

            <p>{{ resultado }}</p>

            {% if nombre_mayor != "" %}

                <p>El nombre tiene: {{ cantidad_caracteres }} caracteres</p>

            {% endif %}

        {% endif %}

    </div>

</body>
</html>
